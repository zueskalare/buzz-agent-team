# Which events start a turn for the discussion partner (harness: crates/buzz-acp/src/filter.rs).
# Rules are tried in order and the first match wins. Each filter is an evalexpr expression on the
# event's author (hex public key): the partner takes no turn for this team's own agents, and none
# for other local agents of this channel unless they mention it. agent-team.sh writes the keys.
[[rules]]
name = "Project discussion"
channels = ["{{CHANNEL_ID}}"]
kinds = [9, 40002]
require_mention = false
filter = '{{TEAM_FILTER}}'

[[rules]]
name = "Direct mentions"
channels = "all"
kinds = [9, 40002, 40003, 46010, 40007]
require_mention = true
filter = '{{OWN_FILTER}}'
